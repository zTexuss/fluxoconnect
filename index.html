<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Roleplay Connect</title>
    <link rel="icon" href="assets/icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bubblesContainer" class="bubbles-container"></div>

    <div class="container">
        <div class="logo-container">
            <img src="assets/logo.gif" alt="Fluxo Roleplay">
        </div>

        <h1>Conectando ao servidor<span class="dots"></span></h1>
        <div class="server-info">Fluxo Roleplay</div>

        <div class="spinner"></div>

        <div class="server-info small">
            Aguarde, você será conectado automaticamente
        </div>

        <div id="mtaWarning" class="mta-warning">
            <p>MTA não detectado no seu computador.</p>
            <a href="https://multitheftauto.com/" target="_blank">
                Baixar MTA
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
